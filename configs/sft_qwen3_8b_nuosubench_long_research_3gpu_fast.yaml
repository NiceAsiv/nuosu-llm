stage: sft
base_model: Qwen/Qwen3-8B-Base
init_adapter: outputs/qwen3-8b-nuosu-nuosubench-short-sft-3gpu-fast
train_file: ../nuosu-corpus/data/processed/bootstrap_nuosu_bench_length_buckets/train_long.jsonl
eval_file: ../nuosu-corpus/data/processed/bootstrap_nuosu_bench_length_buckets/validation_long.jsonl
output_dir: outputs/qwen3-8b-nuosu-nuosubench-sft-3gpu-fast
seed: 42

# Long-tail rows are isolated so they do not force the 99% short majority to
# use a one-sample micro-batch. Reserved research tests remain excluded.
data_policy: academic_research_split_from_nuosu_bench

quantization:
  enabled: true
  bits: 4
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: all-linear
  bias: none

training:
  max_length: 4096
  packing: false
  assistant_only_loss: true
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  learning_rate: 0.00004
  num_train_epochs: 1
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  bf16: true
  fp16: false
  tf32: true
  attn_implementation: sdpa
  group_by_length: true
  dataloader_num_workers: 2
  dataloader_prefetch_factor: 2
  dataloader_pin_memory: true
  dataloader_persistent_workers: true
  optim: adamw_torch_fused
  max_grad_norm: 1.0
  ddp_find_unused_parameters: false
  ddp_broadcast_buffers: false
  sanitize_nonfinite_gradients: true
  report_to: none
  resume_from_checkpoint: null
