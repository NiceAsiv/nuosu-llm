stage: sft
base_model: /replace/with/verified/local/model
train_file: artifacts/gates/sft-overfit-64/train.jsonl
eval_file: artifacts/gates/sft-overfit-64/train.jsonl
output_dir: outputs/gates/qwen3-8b-sft-overfit-64
seed: 42

data_policy: deterministic_training_gate_only

quantization:
  enabled: true
  bits: 4
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16

lora:
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules: all-linear
  bias: none

training:
  max_length: 128
  packing: false
  assistant_only_loss: true
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  learning_rate: 0.0002
  num_train_epochs: 1
  max_steps: 200
  warmup_ratio: 0.03
  weight_decay: 0.0
  lr_scheduler_type: cosine
  logging_steps: 5
  eval_steps: 25
  save_steps: 100
  save_total_limit: 1
  bf16: true
  fp16: false
  tf32: true
  attn_implementation: sdpa
  group_by_length: true
  dataloader_num_workers: 0
  optim: adamw_torch_fused
  max_grad_norm: 1.0
  ddp_find_unused_parameters: false
  ddp_broadcast_buffers: false
  sanitize_nonfinite_gradients: true
  report_to: none
  resume_from_checkpoint: null
