stage: sft
base_model: Qwen/Qwen3-8B-Base
train_file: ../nuosu-corpus/data/processed/bootstrap_nuosu_bench/train.jsonl
eval_file: ../nuosu-corpus/data/processed/bootstrap_nuosu_bench/validation.jsonl
output_dir: outputs/qwen3-8b-nuosu-benchmark-research
seed: 42

# 学术研究配置：80% train、10% validation、10% reserved internal_test。
# 训练后使用保留的 internal_test，不使用完整官方 test 作为最终成绩。
data_policy: academic_research_split_from_nuosu_bench

quantization:
  enabled: true
  bits: 4
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: all-linear
  bias: none

training:
  max_length: 2048
  packing: true
  assistant_only_loss: true
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  learning_rate: 0.00008
  num_train_epochs: 2
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  bf16: true
  fp16: false
  report_to: none
  resume_from_checkpoint: null
