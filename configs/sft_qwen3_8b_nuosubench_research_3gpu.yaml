stage: sft
base_model: Qwen/Qwen3-8B-Base
init_adapter: outputs/qwen3-8b-nuosu-dictionary-sft-3gpu-stable
train_file: ../nuosu-corpus/data/processed/bootstrap_nuosu_bench/train.jsonl
eval_file: ../nuosu-corpus/data/processed/bootstrap_nuosu_bench/validation.jsonl
output_dir: outputs/qwen3-8b-nuosu-nuosubench-sft-3gpu-stable
seed: 42

# Only the research train/validation projections are used here.
# internal_test and research_test_eval remain excluded from training.
data_policy: academic_research_split_from_nuosu_bench

quantization:
  enabled: true
  bits: 4
  quant_type: nf4
  double_quant: true
  compute_dtype: float32

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: all-linear
  bias: none

training:
  max_length: 2048
  packing: false
  assistant_only_loss: true
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 5
  gradient_checkpointing: true
  learning_rate: 0.00008
  num_train_epochs: 2
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  bf16: false
  fp16: false
  tf32: true
  max_grad_norm: 1.0
  ddp_find_unused_parameters: false
  sanitize_nonfinite_gradients: true
  report_to: none
  resume_from_checkpoint: null
