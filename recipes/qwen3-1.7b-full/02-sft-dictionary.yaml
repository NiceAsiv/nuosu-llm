stage: sft
base_model: Qwen/Qwen3-1.7B-Base
init_adapter: outputs/qwen3-1.7b-nuosu-ocr-gt-cpt
train_file: ../nuosu-corpus/data/processed/yixueyanjiu_dictionary_sft/train.jsonl
eval_file: ../nuosu-corpus/data/processed/yixueyanjiu_dictionary_sft/validation.jsonl
output_dir: outputs/qwen3-1.7b-nuosu-dictionary-sft
seed: 42

data_policy: academic_research_with_source_attribution

quantization:
  enabled: false
  compute_dtype: bfloat16

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: all-linear
  bias: none

training:
  max_length: 128
  packing: false
  assistant_only_loss: true
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 4
  gradient_checkpointing: false
  learning_rate: 0.0001
  num_train_epochs: 2
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  logging_steps: 10
  eval_steps: 250
  save_steps: 250
  save_total_limit: 2
  bf16: true
  fp16: false
  tf32: true
  attn_implementation: sdpa
  group_by_length: true
  dataloader_num_workers: 4
  dataloader_prefetch_factor: 2
  dataloader_pin_memory: true
  dataloader_persistent_workers: true
  optim: adamw_torch_fused
  max_grad_norm: 1.0
  ddp_find_unused_parameters: false
  ddp_broadcast_buffers: false
  report_to: none
  resume_from_checkpoint: null
