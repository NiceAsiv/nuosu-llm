stage: sft
base_model: Qwen/Qwen3-1.7B-Base
init_adapter: outputs/qwen3-1.7b-nuosu-mt-cpt-v20260805
train_file: artifacts/datasets/nuosu-mt-v20260804/train.jsonl
eval_file: artifacts/datasets/nuosu-mt-v20260804/validation.jsonl
output_dir: outputs/qwen3-1.7b-nuosu-mt-sft-v20260805
seed: 42
data_revision: v2026.08.04
data_policy: target_only_all_usable_quality_rebalanced

tokenizer_expansion:
  enabled: true
  add_standard_yi_syllables: true
  add_yi_radicals: true
  extra_tokens_file: null
  pad_to_multiple_of: 64

data_sampling:
  repeat_by_task:
    mt_translation_published: 3
    mt_translation_sentence: 2

quantization:
  enabled: false
  compute_dtype: bfloat16

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: all-linear
  bias: none

training:
  max_length: 1024
  packing: false
  attn_implementation: sdpa
  assistant_only_loss: false
  completion_only_loss: true
  prompt_completion: true
  append_no_think: true
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  learning_rate: 0.00005
  num_train_epochs: 1
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  bf16: true
  fp16: false
  tf32: true
  group_by_length: true
  dataloader_num_workers: 2
  dataloader_prefetch_factor: 2
  dataloader_pin_memory: true
  dataloader_persistent_workers: true
  optim: adamw_torch_fused
  max_grad_norm: 1.0
  ddp_find_unused_parameters: false
  ddp_broadcast_buffers: false
  sanitize_nonfinite_gradients: true
  report_to: none
  resume_from_checkpoint: null
