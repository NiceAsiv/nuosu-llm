stage: sft
base_model: Qwen/Qwen3-8B-Base
init_adapter: outputs/qwen3-8b-nuosu-dictionary-sft-3gpu-fast
train_file: ../nuosu-corpus/data/processed/bootstrap_nuosu_bench_length_buckets/train_short.jsonl
eval_file: ../nuosu-corpus/data/processed/bootstrap_nuosu_bench_length_buckets/validation_short.jsonl
output_dir: outputs/qwen3-8b-nuosu-nuosubench-short-sft-3gpu-fast
seed: 42

# Only the research train/validation projections are used here.
# internal_test and research_test_eval remain excluded from training.
data_policy: academic_research_split_from_nuosu_bench

quantization:
  enabled: true
  bits: 4
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: all-linear
  bias: none

training:
  # This stage contains only rows <=512 tokens; longer rows are trained by the
  # follow-up long-tail config instead of being truncated.
  max_length: 512
  packing: false
  assistant_only_loss: true
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  learning_rate: 0.00008
  num_train_epochs: 2
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  logging_steps: 10
  eval_steps: 500
  save_steps: 500
  save_total_limit: 3
  bf16: true
  fp16: false
  tf32: true
  attn_implementation: sdpa
  group_by_length: true
  dataloader_num_workers: 4
  dataloader_prefetch_factor: 2
  dataloader_pin_memory: true
  dataloader_persistent_workers: true
  optim: adamw_torch_fused
  max_grad_norm: 1.0
  ddp_find_unused_parameters: false
  ddp_broadcast_buffers: false
  sanitize_nonfinite_gradients: true
  report_to: none
  resume_from_checkpoint: null
